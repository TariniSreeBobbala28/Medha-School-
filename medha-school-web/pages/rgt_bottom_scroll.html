<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrolling Images</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #a9c8d4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .scroll-container {
    width: 600px;      
    height: 150px;   
    overflow: hidden;
    border: 2px solid #0077b6;
    border-radius: 10px;
    background: #e0f7fa;
    position: relative;
  }

  .scroll-images {
    display: flex;
    width: max-content;  
    animation: scrollLeft 10s linear infinite;
  }

  .scroll-images img {
    height: 130px;      
    margin: 0 5px;
    border-radius: 5px;
    object-fit: contain; 
    flex-shrink: 0;      
  }

  @keyframes scrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); } 
</style>
</head>
<body>

<div class="scroll-container">
  <div class="scroll-images">
    <img src="school.jpeg" alt="Image 1">
    <img src="table.png" alt="Image 2">
    <img src="main_logo.jpeg" alt="Image 3">
    <img src="classroom.jpeg" alt="Image 4">
    <img src="school.jpeg" alt="Image 1">
    <img src="table.png" alt="Image 2">
    <img src="main_logo.jpeg" alt="Image 3">
    <img src="classroom.jpeg" alt="Image 4">
  </div>
</div>

</body>
</html>
